version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(nuget)"
    ignore:
      - dependency-name: AutoCAD.NET
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/pr-title.yml
      - .github/workflows/pr-labeler.yml
    ignore:
      - dependency-name: splrad/steward
      - dependency-name: splrad/steward/.github/workflows/product-release.yml
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(sdk)"
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(npm)"
