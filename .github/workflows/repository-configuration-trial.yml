name: Configuration build trial
run-name: Configuration trial ${{ inputs.head }} ${{ inputs.unit }}/${{ inputs.target }} ${{ inputs.key }}
on:
  workflow_dispatch:
    inputs:
      head: {type: string, required: true}
      unit: {type: string, required: true}
      target: {type: string, required: true}
      key: {type: string, required: true}
      runner: {type: string, required: true}
      tools: {type: string, required: true}
      output: {type: string, required: true}
permissions:
  contents: read
jobs:
  admit:
    if: github.actor_id == '301115370' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.identity.outputs.runner }}
    steps:
      - id: identity
        shell: bash
        env:
          LABEL: ${{ inputs.runner }}
          HEAD: ${{ inputs.head }}
          UNIT: ${{ inputs.unit }}
          TARGET: ${{ inputs.target }}
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail
          [[ "$HEAD" =~ ^[a-f0-9]{40}$ && "$KEY" =~ ^[a-f0-9]{64}$ ]]
          [[ "$UNIT" =~ ^[a-z][a-z0-9-]*$ && "$TARGET" =~ ^[a-z][a-z0-9-]*$ ]]
          [[ "$LABEL" =~ ^(ubuntu-(22\.04|24\.04|latest)|windows-(2022|2025|latest)|macos-(14|15|26|latest)(-intel)?)$ ]]
          echo "runner=$LABEL" >> "$GITHUB_OUTPUT"
  build:
    needs: admit
    runs-on: ${{ needs.admit.outputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.head }}
          path: product
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        if: fromJSON(inputs.tools).dotnet != null
        with:
          dotnet-version: ${{ fromJSON(inputs.tools).dotnet['dotnet-version'] }}
          global-json-file: ${{ fromJSON(inputs.tools).dotnet['global-json-file'] }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: fromJSON(inputs.tools).node != null
        with:
          node-version: ${{ fromJSON(inputs.tools).node['node-version'] }}
          node-version-file: ${{ fromJSON(inputs.tools).node['node-version-file'] }}
          package-manager-cache: false
      - name: Build
        shell: pwsh
        env:
          UNIT: ${{ inputs.unit }}
          TARGET: ${{ inputs.target }}
        run: node "product/.github/actions/configuration/$env:UNIT/$env:TARGET/run.mjs"
      - name: Archive build directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trial-${{ inputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: product/${{ inputs.output }}
          if-no-files-found: error
          retention-days: 7
