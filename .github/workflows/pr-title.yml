name: SPLRAD PR Title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  semantic:
    name: Check title
    uses: splrad/steward/.github/workflows/pr-title-reusable.yml@0a26c87ba7e3cdb069b9af82760219116d552805
  title:
    name: SPLRAD PR Title
    needs: semantic
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Pass the shared title result
        if: always() && needs.semantic.result == 'success'
        run: exit 0
      - name: Fail the shared title result
        if: always() && needs.semantic.result != 'success'
        run: exit 1
