name: LayerScape Channel Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: layerscape-channel-preflight
  cancel-in-progress: false
jobs:
  ghcr-metadata:
    if: github.repository == 'splrad/LayerScape' && github.repository_id == '1187527897' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    environment:
      name: channel-read
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 1fb5683cfa3684aba5db9fb1ca4d0106e7ea81da
          path: controller
          persist-credentials: false
      - name: Verify dedicated metadata credential visibility
        shell: pwsh
        env:
          GHCR_METADATA_TOKEN: ${{ secrets.CHANNEL_READ_TOKEN }}
          OWNER_INVENTORY: ${{ vars.GHCR_OWNER_PACKAGE_INVENTORY }}
        run: |
          $ErrorActionPreference='Stop'
          $metadataToken=$env:GHCR_METADATA_TOKEN
          Remove-Item Env:GHCR_METADATA_TOKEN -ErrorAction SilentlyContinue
          . ./controller/scripts/ghcr-package-state.ps1
          if ([string]::IsNullOrWhiteSpace($metadataToken)) { throw 'GHCR_METADATA_TOKEN_REQUIRED' }
          $apiVersion=(Get-Content -LiteralPath controller/config/github-api.json -Raw | ConvertFrom-Json).version
          $headers=@{Authorization="Bearer $metadataToken";Accept='application/vnd.github+json';'X-GitHub-Api-Version'=$apiVersion}
          $identity=Invoke-RestMethod -Uri 'https://api.github.com/user' -Headers $headers
          if ($identity.id -ne 44151430 -or $identity.login -cne 'axiomoth') { throw 'GHCR_METADATA_IDENTITY_MISMATCH' }
          $package=Get-LayerScapePackageState -Token $metadataToken -OwnerInventory $env:OWNER_INVENTORY
          $record=[ordered]@{
            repositoryId=1187527897
            metadataPrincipalId=$identity.id
            sourceSha=$env:GITHUB_SHA
            runId=[long]$env:GITHUB_RUN_ID
            attempt=[int]$env:GITHUB_RUN_ATTEMPT
            observedAt=[DateTimeOffset]::UtcNow.ToString('o')
            package=$package
          }
          $record|ConvertTo-Json -Depth 6|Set-Content -LiteralPath ghcr-preflight.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ghcr-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ghcr-preflight.json
          if-no-files-found: error
          retention-days: 90
