name: LayerScape Channel Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: layerscape-channel-preflight
  cancel-in-progress: false
jobs:
  ghcr-metadata:
    if: github.repository == 'splrad/LayerScape' && github.repository_id == '1187527897' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    environment:
      name: channel-read
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 115b3447bdd5414c0767f35f304c828a3fb45953
          path: controller
          persist-credentials: false
      - name: Verify product token metadata visibility
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ github.token }}
          OWNER_INVENTORY: ${{ vars.GHCR_OWNER_PACKAGE_INVENTORY }}
        run: |
          $ErrorActionPreference='Stop'
          . ./controller/scripts/ghcr-package-state.ps1
          try {
            $package=Get-LayerScapePackageState -Token $env:GHCR_TOKEN -OwnerInventory $env:OWNER_INVENTORY
          } catch {
            # Preserve the failure; bound and redact API error messages from the same read-only token.
            $headers=@{Authorization="Bearer $env:GHCR_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2026-03-10'}
            foreach ($endpoint in @('https://api.github.com/orgs/splrad/packages?package_type=container&per_page=100&page=1','https://api.github.com/orgs/splrad/packages/container/layerscape-assets')) {
              try {
                $response=Invoke-WebRequest -Uri $endpoint -Headers $headers -SkipHttpErrorCheck
                Write-Host "GHCR_METADATA_DIAGNOSTIC endpoint=$endpoint status=$([int]$response.StatusCode)"
                if ([int]$response.StatusCode -ge 400) {
                  $apiMessage=($response.Content | ConvertFrom-Json -ErrorAction SilentlyContinue).message
                  if ($apiMessage -is [string]) {
                    $safeMessage=$apiMessage.Replace($env:GHCR_TOKEN,'[REDACTED]') -replace '[\r\n\x00-\x1f]',' '
                    Write-Host "GHCR_METADATA_API_MESSAGE $($safeMessage.Substring(0,[Math]::Min(300,$safeMessage.Length)))"
                  }
                }
              } catch {
                Write-Host "GHCR_METADATA_DIAGNOSTIC endpoint=$endpoint status=TRANSPORT_ERROR"
              }
            }
            throw
          }
          $record=[ordered]@{
            repositoryId=1187527897
            sourceSha=$env:GITHUB_SHA
            runId=[long]$env:GITHUB_RUN_ID
            attempt=[int]$env:GITHUB_RUN_ATTEMPT
            observedAt=[DateTimeOffset]::UtcNow.ToString('o')
            package=$package
          }
          $record|ConvertTo-Json -Depth 6|Set-Content -LiteralPath ghcr-preflight.json -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ghcr-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ghcr-preflight.json
          if-no-files-found: error
          retention-days: 90
