      - name: Read canonical channel request
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          node controller/packages/runner/dist/index.js release-pipeline channel-source --inputs inputs.json --state-dir state --controller-dir controller --stage admit --output selection.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Read exact formal Release bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
