          node controller/packages/runner/dist/index.js release-pipeline channel-download --inputs inputs.json --state-dir state --controller-dir controller --unit "$env:UNIT" --channel "$env:CHANNEL" --directory final --output manifest.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Resolve locked controller channel tool
