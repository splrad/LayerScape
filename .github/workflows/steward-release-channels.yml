          WINGET_FORK_REPOSITORY: ${{ vars.WINGET_FORK_REPOSITORY }}
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content -LiteralPath manifest.json -Raw|ConvertFrom-Json
          $version=$manifest.version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'WINGET_VERSION' }
          $installer=@($manifest.artifacts|Where-Object {$_.id -eq 'deployer'})
          if ($installer.Count -ne 1) { throw 'WINGET_INSTALLER' }
          $url="https://github.com/splrad/LayerScape/releases/download/$($manifest.tag)/$($installer[0].path)"
          $upstream=gh api repos/microsoft/winget-pkgs|ConvertFrom-Json
          if ($LASTEXITCODE -or $upstream.full_name -ne 'microsoft/winget-pkgs') { throw 'WINGET_UPSTREAM_IDENTITY' }
          if ($env:WINGET_FORK_REPOSITORY -cne 'axiomoth/winget-pkgs') { throw 'WINGET_FIXED_FORK_REQUIRED' }
          $fork=gh api "repos/$env:WINGET_FORK_REPOSITORY"|ConvertFrom-Json
          if ($LASTEXITCODE -or $fork.full_name -cne 'axiomoth/winget-pkgs' -or $fork.private -or $fork.owner.type -cne 'User' -or -not $fork.fork -or $fork.parent.id -ne $upstream.id) { throw 'WINGET_FORK_IDENTITY' }
          $branch="steward/SPLRAD.LayerScape.Deployer/$version"
          $query='repos/microsoft/winget-pkgs/pulls?state=all&head='+[Uri]::EscapeDataString("$($fork.owner.login):$branch")+'&base='+[Uri]::EscapeDataString($upstream.default_branch)+'&per_page=100'
          function Get-VersionPr {
            $pages=gh api --paginate --slurp $query
            if ($LASTEXITCODE) { throw 'WINGET_PR_READ_UNKNOWN' }
            $prs=@(($pages|ConvertFrom-Json)|ForEach-Object {$_}|Where-Object {$_.head.repo.id -eq $fork.id -and $_.head.ref -eq $branch -and $_.base.repo.id -eq $upstream.id -and $_.base.ref -eq $upstream.default_branch})
            if ($prs.Count -gt 1) { throw 'WINGET_DUPLICATE_PR' }
            if ($prs.Count -eq 0) { return $null }
            $pr=gh api "repos/microsoft/winget-pkgs/pulls/$($prs[0].number)"|ConvertFrom-Json
            if ($LASTEXITCODE) { throw 'WINGET_PR_READ_UNKNOWN' };return $pr
          }
          $pr=Get-VersionPr
          if ($env:MODE -eq 'submit' -and $null -eq $pr) {
            $packagePath='manifests/s/SPLRAD/LayerScape/Deployer'
            $package=gh api --include "repos/microsoft/winget-pkgs/contents/$packagePath" 2>$null
            $status=[regex]::Match(($package -join "`n"),'HTTP/\S+ (\d+)').Groups[1].Value
            if ($status -eq '200') {
              & $env:WINGETCREATE_EXE update SPLRAD.LayerScape.Deployer --version $version --urls "$url|x64" --out generated --format yaml
              if ($LASTEXITCODE) { throw 'WINGET_CREATE_UPDATE' }
              $directory=Join-Path $pwd "generated/$packagePath/$version"
            } elseif ($status -eq '404') {
              # Public upstream repository read succeeded; this exact native path does not exist.
              $directory=Join-Path $pwd 'generated-first';New-Item -ItemType Directory -Path $directory|Out-Null
              $template=Get-Content -LiteralPath product/.github/winget/SPLRAD.LayerScape.Deployer.yaml.mustache -Raw
              $content=$template.Replace('${version}',$version).Replace('${installerUrl}',$url).Replace('${installerSha256}',$installer[0].sha256.ToUpperInvariant())
              [IO.File]::WriteAllText((Join-Path $directory 'SPLRAD.LayerScape.Deployer.yaml'),$content,[Text.UTF8Encoding]::new($false))
            } else { throw 'WINGET_PACKAGE_READ_UNKNOWN' }
            winget validate --manifest $directory --disable-interactivity
            if ($LASTEXITCODE) { throw 'WINGET_VALIDATION' }
            $files=@(Get-ChildItem -LiteralPath $directory -File)
            if ($files.Count -lt 1 -or ($files|Where-Object {$_.Extension -ne '.yaml'})) { throw 'WINGET_MANIFEST_SET' }
            $entries=@()
            foreach($file in $files) {
              $text=[IO.File]::ReadAllText($file.FullName)
              if ($text -notmatch [regex]::Escape($version) -or $text -notmatch 'SPLRAD.LayerScape.Deployer') { throw 'WINGET_MANIFEST_VERSION' }
              if ($text -match 'InstallerUrl:' -and ($text -notmatch [regex]::Escape($url) -or $text -notmatch $installer[0].sha256)) { throw 'WINGET_MANIFEST_BYTES' }
              $entries+=@{path="$packagePath/$version/$($file.Name)";mode='100644';type='blob';content=$text}
            }
            $ref=gh api --include "repos/$env:WINGET_FORK_REPOSITORY/git/ref/heads/$branch" 2>$null
            $refStatus=[regex]::Match(($ref -join "`n"),'HTTP/\S+ (\d+)').Groups[1].Value
            if ($refStatus -eq '404') {
              $base=gh api "repos/microsoft/winget-pkgs/commits/$($upstream.default_branch)"|ConvertFrom-Json
              if ($LASTEXITCODE) { throw 'WINGET_BASE_READ' }
              @{base_tree=$base.commit.tree.sha;tree=$entries}|ConvertTo-Json -Depth 15|Set-Content -LiteralPath tree.json -Encoding utf8
              $tree=gh api --method POST "repos/$env:WINGET_FORK_REPOSITORY/git/trees" --input tree.json|ConvertFrom-Json
              if ($LASTEXITCODE) { throw 'WINGET_TREE_WRITE' }
              @{message="Add SPLRAD.LayerScape.Deployer $version";tree=$tree.sha;parents=@($base.sha)}|ConvertTo-Json|Set-Content -LiteralPath commit.json -Encoding utf8
              $commit=gh api --method POST "repos/$env:WINGET_FORK_REPOSITORY/git/commits" --input commit.json|ConvertFrom-Json
              if ($LASTEXITCODE) { throw 'WINGET_COMMIT_WRITE' }
              @{ref="refs/heads/$branch";sha=$commit.sha}|ConvertTo-Json|Set-Content -LiteralPath ref.json -Encoding utf8
              gh api --method POST "repos/$env:WINGET_FORK_REPOSITORY/git/refs" --input ref.json|Out-Null
              # A lost creation response or 422 is reconciled by reading each exact intended file below.
            } elseif ($refStatus -ne '200') { throw 'WINGET_FORK_READ_UNKNOWN' }
            foreach($entry in $entries) {
              $actual=gh api "repos/$env:WINGET_FORK_REPOSITORY/contents/$($entry.path)?ref=$([Uri]::EscapeDataString($branch))"|ConvertFrom-Json
              if ($LASTEXITCODE -or $actual.encoding -ne 'base64' -or [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($actual.content)) -cne $entry.content) { throw 'WINGET_FORK_CONTENT_CONFLICT' }
            }
            # Query again before POST; repeated responses never authorize a second version PR.
            $pr=Get-VersionPr
            if ($null -eq $pr) {
