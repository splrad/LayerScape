          if (-not $prFiles.Count -or @($prFiles|Where-Object {$_.filename -notlike "$prefix*.yaml" -or $_.filename.Substring($prefix.Length).Contains('/') -or $_.status -eq 'removed'}).Count) { throw 'WINGET_PR_SCOPE_CONFLICT' }
          $checkDirectory=Join-Path $pwd 'verified-pr';New-Item -ItemType Directory -Path $checkDirectory|Out-Null
          $urls=@();$hashes=@()
          foreach($file in $prFiles) {
            $actual=gh api "repos/$env:WINGET_FORK_REPOSITORY/contents/$($file.filename)?ref=$($pr.head.sha)"|ConvertFrom-Json
            if ($LASTEXITCODE -or $actual.encoding -ne 'base64') { throw 'WINGET_PR_CONTENT_UNKNOWN' }
            $content=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($actual.content))
            [IO.File]::WriteAllText((Join-Path $checkDirectory ([IO.Path]::GetFileName($file.filename))),$content,[Text.UTF8Encoding]::new($false))
            $urls+=@([regex]::Matches($content,'(?m)^\s*InstallerUrl:\s*([^\r\n]+?)\s*$')|ForEach-Object {$_.Groups[1].Value.Trim('"',"'")})
            $hashes+=@([regex]::Matches($content,'(?m)^\s*InstallerSha256:\s*([A-Fa-f0-9]{64})\s*$')|ForEach-Object {$_.Groups[1].Value})
          }
          if ($urls.Count -ne 1 -or $hashes.Count -ne 1 -or $urls[0] -cne $url -or $hashes[0] -ine $installer[0].sha256) { throw 'WINGET_PR_BYTES_CONFLICT' }
          winget validate --manifest $checkDirectory --disable-interactivity
          if ($LASTEXITCODE) { throw 'WINGET_PR_VALIDATION' }
          $consumed=$false;$indexed=$false
          if ($env:MODE -eq 'verify') {
            if (-not $pr.merged) { throw 'DEPENDENCY_NOT_READY' }
            winget source update --name winget --disable-interactivity
            if ($LASTEXITCODE) { throw 'WINGET_INDEX_UNKNOWN' }
            winget show --id SPLRAD.LayerScape.Deployer --exact --version $version --source winget --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE) { throw 'DEPENDENCY_NOT_READY' }
            $indexed=$true
            foreach ($selectionMode in @('exact','default')) {
              $arguments=@('install','--id','SPLRAD.LayerScape.Deployer','--exact','--source','winget','--scope','user','--accept-package-agreements','--accept-source-agreements','--disable-interactivity')
              if ($selectionMode -eq 'exact') { $arguments+=@('--version',$version) }
              else {
                $defaultShow=winget show --id SPLRAD.LayerScape.Deployer --exact --source winget --accept-source-agreements --disable-interactivity
                $defaultShow | Write-Output
                if ($LASTEXITCODE -or ($defaultShow -join [Environment]::NewLine) -notmatch ('(?m)^Version:\s*'+[Regex]::Escape($version)+'\s*$')) { throw 'WINGET_DEFAULT_VERSION' }
              }
              winget @arguments
              if ($LASTEXITCODE) { throw 'WINGET_INSTALL_FAILED' }
              try {
                $installed=Get-Command layerscape-deployer.exe -ErrorAction Stop
                if ((Get-FileHash -LiteralPath $installed.Source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $installer[0].sha256) { throw 'WINGET_INSTALLED_BYTES' }
              } finally {
                winget uninstall --id SPLRAD.LayerScape.Deployer --exact --source winget --disable-interactivity
                if ($LASTEXITCODE) { throw 'WINGET_UNINSTALL_FAILED' }
              }
            }
            $consumed=$true
          }
          @{id=[string]$pr.number;accepted=[bool]$pr.merged;indexed=$indexed;consumed=$consumed;observedAt=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Compress|Set-Content -LiteralPath native.json -Encoding utf8
      - name: Capture native result
        shell: pwsh
        env:
          UNIT: ${{ matrix.unitId }}
          CHANNEL: ${{ matrix.channelId }}
        run: |

          $selection=Get-Content -LiteralPath selection.json -Raw|ConvertFrom-Json
          $target=$selection.targets|Where-Object {$_.unitId -eq $env:UNIT -and $_.channelId -eq $env:CHANNEL}
          $native=Get-Content -LiteralPath native.json -Raw|ConvertFrom-Json
          $item=[ordered]@{unitId=$target.unitId;channelId=$target.channelId;version=$target.version;releaseId=$target.releaseId;manifestDigest=$target.manifestDigest;nativeObjectId=$native.id;digest=$target.manifestDigest;accepted=[bool]$native.accepted;indexed=[bool]$native.indexed;consumed=[bool]$native.consumed;observedAt=$native.observedAt}
          $payload=[ordered]@{schemaVersion=1;cycleId=$selection.context.cycle.id;sourceSha=$selection.context.cycle.sourceSha;executionSha=$env:GITHUB_SHA;controllerSha=$selection.context.cycle.controllerSha;targetsDigest=$selection.targetsDigest;nativeRunId=[long]$env:GITHUB_RUN_ID;runAttempt=[int]$env:GITHUB_RUN_ATTEMPT;items=@($item)}
          [IO.File]::WriteAllText((Join-Path $pwd 'report.json'),($payload|ConvertTo-Json -Depth 20 -Compress),[Text.UTF8Encoding]::new($false))
      - id: report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: channel-${{ inputs.request_key }}-${{ matrix.unitId }}-${{
            matrix.channelId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: report.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive actual business steps
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT: ${{ matrix.unitId }}
          CHANNEL: ${{ matrix.channelId }}
          ARTIFACT_ID: ${{ steps.report.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.report.outputs.artifact-digest }}
        run: |-
          $objects='[]'
          if ($env:ARTIFACT_ID) { $objects=ConvertTo-Json -InputObject @(@{kind='artifact';id=[long]$env:ARTIFACT_ID;digest=$env:ARTIFACT_DIGEST.Replace('sha256:','')}) -Compress }
          node controller/packages/runner/dist/index.js release-pipeline channel-result --inputs inputs.json --state-dir state --controller-dir controller --unit "$env:UNIT" --channel "$env:CHANNEL" --job-name "verify/winget/$env:UNIT" --objects $objects --output receipt.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  collect:
    needs:
      - source-check
      - admit
      - channel-prepare
      - observe
      - ghcr-assets-submit
      - ghcr-assets-verify
      - winget-submit
      - winget-verify
    if: always()
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Record native job conclusions
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
          MODE: ${{ inputs.mode }}
        run: |-
          $results=$env:RESULTS|ConvertFrom-Json
          if ($results.'source-check'.result -ne 'success') { throw 'CHANNEL_SOURCE_FAILED' }
          foreach ($item in $results.PSObject.Properties) { if ($item.Value.result -in @('failure','cancelled')) { throw 'CHANNEL_NATIVE_JOB_FAILED' } }
          $requiredJobs=@('source-check')
          switch -CaseSensitive ($env:MODE) {
            'observe' { $requiredJobs+='observe' }
            { $_ -cin @('submit','verify') } {
              $requiredJobs+=@('admit','channel-prepare')
              $outputs=$results.'channel-prepare'.outputs
              foreach ($channel in @(@{flag='has_ghcr';job='ghcr-assets'},@{flag='has_winget';job='winget'})) {
                $selected=$outputs.($channel.flag)
                if ($selected -cnotin @('true','false')) { throw 'CHANNEL_SELECTION_UNKNOWN' }
                if ($selected -ceq 'true') { $requiredJobs+="$($channel.job)-$env:MODE" }
              }
            }
            default { throw 'CHANNEL_MODE_INVALID' }
          }
          foreach ($job in $requiredJobs) {
            if ($results.$job.result -cne 'success') { throw "CHANNEL_REQUIRED_JOB_INCOMPLETE: $job" }
          }
