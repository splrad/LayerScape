name: Product Release Channels
run-name: Channels ${{ inputs.mode }} ${{ inputs.request_key }}
on:
  workflow_dispatch:
    inputs:
      cycle_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      execution_sha:
        type: string
        required: true
      controller_sha:
        type: string
        required: true
      targets_json:
        type: string
        required: true
      mode:
        type: string
        required: true
      operation_key:
        type: string
        required: true
      request_key:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-product-channels-${{ github.repository_id }}-${{ inputs.mode ==
    'observe' && 'observe' || 'business' }}
  queue: max
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      targets_digest: ${{ steps.identity.outputs.targets_digest }}
      matrix: ${{ steps.identity.outputs.matrix }}
      has_work: ${{ steps.identity.outputs.has_work }}
      ghcr_matrix: ${{ steps.identity.outputs.ghcr_matrix }}
      winget_matrix: ${{ steps.identity.outputs.winget_matrix }}
      has_ghcr: ${{ steps.identity.outputs.has_ghcr }}
      has_winget: ${{ steps.identity.outputs.has_winget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 1fb5683cfa3684aba5db9fb1ca4d0106e7ea81da
          path: controller
          persist-credentials: false
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: steward/release-state
          path: state
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.18
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted controller tool paths
        working-directory: controller
        shell: pwsh
        env:
          MISE_SAFE: "1"
          MISE_LOCKED: "1"
        run: |
          $toolPaths = mise bin-paths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolPaths | Add-Content -LiteralPath $env:GITHUB_PATH
      - name: Install locked controller dependencies
        working-directory: controller
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Closed native inputs
        shell: pwsh
        env:
          CHANNEL_INPUTS: ${{ toJSON(inputs) }}
        run: "[IO.File]::WriteAllText((Join-Path $pwd 'inputs.json'),
          $env:CHANNEL_INPUTS, [Text.UTF8Encoding]::new($false))"
      - name: Verify native source
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          node controller/packages/runner/dist/index.js release-pipeline channel-source --inputs inputs.json --state-dir state --controller-dir controller --stage source --output selection.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  admit:
    needs: source-check
    if: inputs.mode != 'observe'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 1fb5683cfa3684aba5db9fb1ca4d0106e7ea81da
          path: controller
          persist-credentials: false
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: steward/release-state
          path: state
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.18
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted controller tool paths
        working-directory: controller
        shell: pwsh
        env:
          MISE_SAFE: "1"
          MISE_LOCKED: "1"
        run: |
          $toolPaths = mise bin-paths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolPaths | Add-Content -LiteralPath $env:GITHUB_PATH
      - name: Install locked controller dependencies
        working-directory: controller
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Closed native inputs
        shell: pwsh
        env:
          CHANNEL_INPUTS: ${{ toJSON(inputs) }}
        run: "[IO.File]::WriteAllText((Join-Path $pwd 'inputs.json'),
          $env:CHANNEL_INPUTS, [Text.UTF8Encoding]::new($false))"
      - name: Read canonical channel request
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          for ($n=0; $n -lt 20; $n++) {
            node controller/packages/runner/dist/index.js release-pipeline channel-source --inputs inputs.json --state-dir state --controller-dir controller --stage admit --output "admission-$n.json"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($LASTEXITCODE -ne 75) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 30
          }
          exit 75
  channel-prepare:
    name: channel-prepare
    needs:
      - source-check
      - admit
    if: inputs.mode != 'observe'
    runs-on: windows-2025
    timeout-minutes: 10
    environment:
      name: channel-read
      deployment: false
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      targets_digest: ${{ steps.ready.outputs.targets_digest }}
      matrix: ${{ steps.ready.outputs.matrix }}
      has_work: ${{ steps.ready.outputs.has_work }}
      ghcr_matrix: ${{ steps.ready.outputs.ghcr_matrix }}
      winget_matrix: ${{ steps.ready.outputs.winget_matrix }}
      has_ghcr: ${{ steps.ready.outputs.has_ghcr }}
      has_winget: ${{ steps.ready.outputs.has_winget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 1fb5683cfa3684aba5db9fb1ca4d0106e7ea81da
          path: controller
          persist-credentials: false
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: steward/release-state
          path: state
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.18
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted controller tool paths
        working-directory: controller
        shell: pwsh
        env:
          MISE_SAFE: "1"
          MISE_LOCKED: "1"
        run: |
          $toolPaths = mise bin-paths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolPaths | Add-Content -LiteralPath $env:GITHUB_PATH
      - name: Install locked controller dependencies
        working-directory: controller
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Closed native inputs
        shell: pwsh
        env:
          CHANNEL_INPUTS: ${{ toJSON(inputs) }}
        run: "[IO.File]::WriteAllText((Join-Path $pwd 'inputs.json'),
          $env:CHANNEL_INPUTS, [Text.UTF8Encoding]::new($false))"
      - name: Read canonical channel request
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          node controller/packages/runner/dist/index.js release-pipeline channel-source --inputs inputs.json --state-dir state --controller-dir controller --stage admit --output selection.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Read current channel readiness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_METADATA_TOKEN: ${{ secrets.CHANNEL_READ_TOKEN }}
          WINGET_FORK_REPOSITORY: ${{ vars.WINGET_FORK_REPOSITORY }}
          GHCR_OWNER_PACKAGE_INVENTORY: ${{ vars.GHCR_OWNER_PACKAGE_INVENTORY }}
        run: |

          $ErrorActionPreference='Stop'
          $metadataToken=$env:GHCR_METADATA_TOKEN
          Remove-Item Env:GHCR_METADATA_TOKEN -ErrorAction SilentlyContinue
          $selection=Get-Content -LiteralPath selection.json -Raw | ConvertFrom-Json
          $items=@()
          $auth=Join-Path $env:RUNNER_TEMP 'oras-read.json'
          [IO.File]::WriteAllText($auth,'{"auths":{}}')
          $env:GHCR_TOKEN | oras login ghcr.io --username $env:GITHUB_ACTOR --password-stdin --registry-config $auth
          if ($LASTEXITCODE) { throw 'CHANNEL_READ_AUTH_UNKNOWN' }
          foreach ($target in $selection.targets) {
            $item=[ordered]@{unitId=$target.unitId;channelId=$target.channelId;version=$target.version;readStatus='AUTH_UNKNOWN';exists=$null;digest=$null;accepted=$null;indexed=$null;observedAt=[DateTime]::UtcNow.ToString('o');evidenceKind=$target.channelId}
            if ($target.channelId -eq 'ghcr-assets') {
              . controller/scripts/ghcr-package-state.ps1
              $package=Get-LayerScapePackageState -Token $metadataToken -OwnerInventory $env:GHCR_OWNER_PACKAGE_INVENTORY
              if ($package.state -eq 'ABSENT') { $item.readStatus='NOT_FOUND_CONFIRMED';$item.exists=$false;$item.accepted=$false;$item.indexed=$false }
              else {
                $tags=oras repo tags ghcr.io/splrad/layerscape-assets --registry-config $auth --format json 2>$null
                if ($LASTEXITCODE -ne 0) { throw 'GHCR_TAG_VISIBILITY_UNKNOWN' }
                $listed=$tags|ConvertFrom-Json
                if ($listed.tags -notcontains $target.version) { $item.readStatus='NOT_FOUND_CONFIRMED';$item.exists=$false;$item.accepted=$false;$item.indexed=$false }
                else {
                  $nativeDigest=oras resolve --registry-config $auth "ghcr.io/splrad/layerscape-assets:$($target.version)" 2>$null
                  if ($LASTEXITCODE -ne 0 -or $nativeDigest.Trim() -notmatch '^sha256:[a-f0-9]{64}$') { throw 'GHCR_DIGEST_UNKNOWN' }
                  $item.readStatus='PENDING';$item.exists=$true;$item.digest=$nativeDigest.Trim();$item.accepted=$true;$item.indexed=$false
                  if ($package.visibility -eq 'public') {
                    $anonymous=Join-Path $env:RUNNER_TEMP 'oras-probe-anonymous.json';[IO.File]::WriteAllText($anonymous,'{"auths":{}}')
                    $publicDigest=oras resolve --registry-config $anonymous "ghcr.io/splrad/layerscape-assets:$($target.version)" 2>$null
                    if ($LASTEXITCODE -eq 0 -and $publicDigest.Trim() -eq $nativeDigest.Trim()) { $item.readStatus='OK';$item.indexed=$true }
                  }
                }
              }
            } elseif ($target.channelId -eq 'winget') {
              $fork=gh api "repos/$env:WINGET_FORK_REPOSITORY" 2>$null
              if ($LASTEXITCODE -eq 0) {
                $fork=$fork|ConvertFrom-Json
                if ($env:WINGET_FORK_REPOSITORY -cne 'axiomoth/winget-pkgs' -or $fork.full_name -cne 'axiomoth/winget-pkgs' -or $fork.private -or $fork.owner.type -cne 'User' -or $fork.parent.full_name -ne 'microsoft/winget-pkgs' -or -not $fork.fork) { throw 'WINGET_FORK_IDENTITY' }
                $upstream=gh api repos/microsoft/winget-pkgs | ConvertFrom-Json
                if ($LASTEXITCODE) { throw 'WINGET_UPSTREAM_READ_UNKNOWN' }
                $branch="steward/SPLRAD.LayerScape.Deployer/$($target.version)"
                $query='repos/microsoft/winget-pkgs/pulls?state=all&head='+[Uri]::EscapeDataString("$($fork.owner.login):$branch")+'&base='+[Uri]::EscapeDataString($upstream.default_branch)+'&per_page=100'
                $pages=gh api --paginate --slurp $query 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $prs=@(($pages|ConvertFrom-Json) | ForEach-Object { $_ } | Where-Object { $_.head.repo.id -eq $fork.id -and $_.head.ref -eq $branch -and $_.base.repo.id -eq $upstream.id -and $_.base.ref -eq $upstream.default_branch })
                  if ($prs.Count -gt 1) { $item.readStatus='CONFLICT' }
                  elseif ($prs.Count -eq 0) { $item.readStatus='NOT_FOUND_CONFIRMED';$item.exists=$false;$item.accepted=$false;$item.indexed=$false }
                  else {
                    $pr=gh api "repos/microsoft/winget-pkgs/pulls/$($prs[0].number)" | ConvertFrom-Json
                    if ($LASTEXITCODE) { throw 'WINGET_PR_READ_UNKNOWN' }
                    if ($pr.state -eq 'closed' -and -not $pr.merged) { $item.readStatus='CONFLICT' }
                    else {
                      $item.readStatus='PENDING';$item.exists=$true;$item.accepted=[bool]$pr.merged;$item.indexed=$false;$item.evidenceKind="github-pr:$($pr.number)"
                      if ($pr.merged) {
                        winget source update --name winget --disable-interactivity | Out-Null
                        if ($LASTEXITCODE) { throw 'WINGET_INDEX_READ_UNKNOWN' }
                        winget show --id SPLRAD.LayerScape.Deployer --exact --version $target.version --source winget --accept-source-agreements --disable-interactivity | Out-Null
                        if ($LASTEXITCODE -eq 0) { $item.readStatus='OK';$item.indexed=$true }
                      }
                    }
                  }
                }
              }
            } else { throw 'UNDECLARED_NATIVE_CHANNEL' }
            $item.observedAt=[DateTime]::UtcNow.ToString('o');$items+=,$item
          }
          [IO.File]::WriteAllText((Join-Path $pwd 'reads.json'),(ConvertTo-Json -InputObject $items -Depth 12 -Compress),[Text.UTF8Encoding]::new($false))
      - name: business-channel-readiness
        id: ready
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          node controller/packages/runner/dist/index.js release-pipeline channel-ready --inputs inputs.json --state-dir state --controller-dir controller --reads reads.json --output readiness.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  observe:
    name: observe
    needs: source-check
    if: inputs.mode == 'observe'
    runs-on: windows-2025
    timeout-minutes: 15
    environment:
      name: channel-read
      deployment: false
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 1fb5683cfa3684aba5db9fb1ca4d0106e7ea81da
          path: controller
          persist-credentials: false
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: steward/release-state
          path: state
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        env:
          MISE_SAFE: "1"
          MISE_NODE_COMPILE: "false"
        with:
          version: 2026.10.18
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted controller tool paths
        working-directory: controller
        shell: pwsh
        env:
          MISE_SAFE: "1"
          MISE_LOCKED: "1"
        run: |
          $toolPaths = mise bin-paths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolPaths | Add-Content -LiteralPath $env:GITHUB_PATH
      - name: Install locked controller dependencies
        working-directory: controller
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Closed native inputs
        shell: pwsh
        env:
          CHANNEL_INPUTS: ${{ toJSON(inputs) }}
        run: "[IO.File]::WriteAllText((Join-Path $pwd 'inputs.json'),
          $env:CHANNEL_INPUTS, [Text.UTF8Encoding]::new($false))"
      - name: Verify native source
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          node controller/packages/runner/dist/index.js release-pipeline channel-source --inputs inputs.json --state-dir state --controller-dir controller --stage source --output selection.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Read native registry PR and index
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_METADATA_TOKEN: ${{ secrets.CHANNEL_READ_TOKEN }}
          WINGET_FORK_REPOSITORY: ${{ vars.WINGET_FORK_REPOSITORY }}
          GHCR_OWNER_PACKAGE_INVENTORY: ${{ vars.GHCR_OWNER_PACKAGE_INVENTORY }}
        run: |

          $ErrorActionPreference='Stop'
          $metadataToken=$env:GHCR_METADATA_TOKEN
          Remove-Item Env:GHCR_METADATA_TOKEN -ErrorAction SilentlyContinue
          $selection=Get-Content -LiteralPath selection.json -Raw | ConvertFrom-Json
          $items=@()
          $auth=Join-Path $env:RUNNER_TEMP 'oras-read.json'
          [IO.File]::WriteAllText($auth,'{"auths":{}}')
          $env:GHCR_TOKEN | oras login ghcr.io --username $env:GITHUB_ACTOR --password-stdin --registry-config $auth
          if ($LASTEXITCODE) { throw 'CHANNEL_READ_AUTH_UNKNOWN' }
          foreach ($target in $selection.targets) {
            $item=[ordered]@{unitId=$target.unitId;channelId=$target.channelId;version=$target.version;readStatus='AUTH_UNKNOWN';exists=$null;digest=$null;accepted=$null;indexed=$null;observedAt=[DateTime]::UtcNow.ToString('o');evidenceKind=$target.channelId}
            if ($target.channelId -eq 'ghcr-assets') {
              . controller/scripts/ghcr-package-state.ps1
              $package=Get-LayerScapePackageState -Token $metadataToken -OwnerInventory $env:GHCR_OWNER_PACKAGE_INVENTORY
              if ($package.state -eq 'ABSENT') { $item.readStatus='NOT_FOUND_CONFIRMED';$item.exists=$false;$item.accepted=$false;$item.indexed=$false }
              else {
                $tags=oras repo tags ghcr.io/splrad/layerscape-assets --registry-config $auth --format json 2>$null
                if ($LASTEXITCODE -ne 0) { throw 'GHCR_TAG_VISIBILITY_UNKNOWN' }
                $listed=$tags|ConvertFrom-Json
                if ($listed.tags -notcontains $target.version) { $item.readStatus='NOT_FOUND_CONFIRMED';$item.exists=$false;$item.accepted=$false;$item.indexed=$false }
                else {
                  $nativeDigest=oras resolve --registry-config $auth "ghcr.io/splrad/layerscape-assets:$($target.version)" 2>$null
                  if ($LASTEXITCODE -ne 0 -or $nativeDigest.Trim() -notmatch '^sha256:[a-f0-9]{64}$') { throw 'GHCR_DIGEST_UNKNOWN' }
                  $item.readStatus='PENDING';$item.exists=$true;$item.digest=$nativeDigest.Trim();$item.accepted=$true;$item.indexed=$false
                  if ($package.visibility -eq 'public') {
                    $anonymous=Join-Path $env:RUNNER_TEMP 'oras-probe-anonymous.json';[IO.File]::WriteAllText($anonymous,'{"auths":{}}')
                    $publicDigest=oras resolve --registry-config $anonymous "ghcr.io/splrad/layerscape-assets:$($target.version)" 2>$null
                    if ($LASTEXITCODE -eq 0 -and $publicDigest.Trim() -eq $nativeDigest.Trim()) { $item.readStatus='OK';$item.indexed=$true }
                  }
                }
              }
            } elseif ($target.channelId -eq 'winget') {
              $fork=gh api "repos/$env:WINGET_FORK_REPOSITORY" 2>$null
              if ($LASTEXITCODE -eq 0) {
                $fork=$fork|ConvertFrom-Json
                if ($env:WINGET_FORK_REPOSITORY -cne 'axiomoth/winget-pkgs' -or $fork.full_name -cne 'axiomoth/winget-pkgs' -or $fork.private -or $fork.owner.type -cne 'User' -or $fork.parent.full_name -ne 'microsoft/winget-pkgs' -or -not $fork.fork) { throw 'WINGET_FORK_IDENTITY' }
                $upstream=gh api repos/microsoft/winget-pkgs | ConvertFrom-Json
                if ($LASTEXITCODE) { throw 'WINGET_UPSTREAM_READ_UNKNOWN' }
                $branch="steward/SPLRAD.LayerScape.Deployer/$($target.version)"
                $query='repos/microsoft/winget-pkgs/pulls?state=all&head='+[Uri]::EscapeDataString("$($fork.owner.login):$branch")+'&base='+[Uri]::EscapeDataString($upstream.default_branch)+'&per_page=100'
                $pages=gh api --paginate --slurp $query 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $prs=@(($pages|ConvertFrom-Json) | ForEach-Object { $_ } | Where-Object { $_.head.repo.id -eq $fork.id -and $_.head.ref -eq $branch -and $_.base.repo.id -eq $upstream.id -and $_.base.ref -eq $upstream.default_branch })
                  if ($prs.Count -gt 1) { $item.readStatus='CONFLICT' }
                  elseif ($prs.Count -eq 0) { $item.readStatus='NOT_FOUND_CONFIRMED';$item.exists=$false;$item.accepted=$false;$item.indexed=$false }
                  else {
                    $pr=gh api "repos/microsoft/winget-pkgs/pulls/$($prs[0].number)" | ConvertFrom-Json
                    if ($LASTEXITCODE) { throw 'WINGET_PR_READ_UNKNOWN' }
                    if ($pr.state -eq 'closed' -and -not $pr.merged) { $item.readStatus='CONFLICT' }
                    else {
                      $item.readStatus='PENDING';$item.exists=$true;$item.accepted=[bool]$pr.merged;$item.indexed=$false;$item.evidenceKind="github-pr:$($pr.number)"
                      if ($pr.merged) {
                        winget source update --name winget --disable-interactivity | Out-Null
                        if ($LASTEXITCODE) { throw 'WINGET_INDEX_READ_UNKNOWN' }
                        winget show --id SPLRAD.LayerScape.Deployer --exact --version $target.version --source winget --accept-source-agreements --disable-interactivity | Out-Null
                        if ($LASTEXITCODE -eq 0) { $item.readStatus='OK';$item.indexed=$true }
                      }
                    }
                  }
                }
              }
            } else { throw 'UNDECLARED_NATIVE_CHANNEL' }
            $item.observedAt=[DateTime]::UtcNow.ToString('o');$items+=,$item
          }
          [IO.File]::WriteAllText((Join-Path $pwd 'reads.json'),(ConvertTo-Json -InputObject $items -Depth 12 -Compress),[Text.UTF8Encoding]::new($false))
      - name: Seal probe payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          node controller/packages/runner/dist/index.js release-pipeline channel-probe --inputs inputs.json --state-dir state --controller-dir controller --reads reads.json --output report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: probe-${{ inputs.cycle_id }}-${{ needs.source-check.outputs.targets_digest
            }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: report.json
          if-no-files-found: error
