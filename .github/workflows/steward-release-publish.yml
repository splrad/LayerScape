name: Product Release
run-name: Build ${{ inputs.operation_key }}
on:
  workflow_dispatch:
    inputs:
      cycle_id:
        type: string
        required: true
      operation_key:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      controller_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: steward-product-release-${{ github.repository_id }}
  queue: max
  cancel-in-progress: false
jobs:
  admit:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: splrad/steward
          ref: 4a01e09b977d1f71ae42bad2054899f8473df554 # controller-v18
          path: controller
          persist-credentials: false
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: steward/release-state
          path: state
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        env:
          MISE_SAFE: '1'
          MISE_NODE_COMPILE: 'false'
        with:
          version: 2026.11.14
          working_directory: controller
          install_args: --locked
          cache: false
          env: false
          persist_github_token: false
      - name: Activate trusted controller tool paths
        working-directory: controller
        shell: pwsh
        env:
          MISE_SAFE: '1'
          MISE_LOCKED: '1'
        run: |
          $toolPaths = mise bin-paths
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolPaths | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked controller dependencies
        working-directory: controller
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked native metadata reader
        shell: pwsh
        run: |
          uv sync --project controller/tools/template --frozen --only-group release-inspection --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Read canonical dispatch and source
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ inputs.cycle_id }}
          OPERATION_KEY: ${{ inputs.operation_key }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          for ($n = 0; $n -lt 20; $n++) {
            node controller/packages/runner/dist/index.js release-pipeline identity --cycle-id "$env:CYCLE_ID" --operation-key "$env:OPERATION_KEY" --source-sha "$env:SOURCE_SHA" --controller-sha "$env:CONTROLLER_SHA" --source-dir product --controller-dir controller --state-dir state --output "identity-$n.json"
            if ($LASTEXITCODE -eq 0) {
              $identity = Get-Content -LiteralPath "identity-$n.json" -Raw | ConvertFrom-Json
              $units = @($identity.units)
              if ($identity.status -cne 'SOURCE_VERIFIED' -or $units.Count -ne 1 -or $units[0].unit -cne 'root') {
                throw 'Expected an admitted root release unit.'
              }
              $version = $units[0].version
              if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or
                  $units[0].tag -cne "v$version" -or $units[0].packageVersion -cne $version) {
                throw 'Admitted version, package version and tag must agree.'
              }
              "version=$version" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($LASTEXITCODE -ne 75) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 30
            git -C state fetch --no-tags origin refs/heads/steward/release-state
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git -C state update-ref refs/heads/steward/release-state FETCH_HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          exit 75
  delivery:
    name: delivery/root
    needs: admit
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.404'
          global-json-file: global.json
      - name: Build release files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.admit.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/github-release"
          dotnet restore tools/UpdateCheck.Tests/UpdateCheck.Tests.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UpdateCheck.Tests/UpdateCheck.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore CADFontAutoReplace.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./tools/Publish-ReleaseAssets.ps1 -OutputDirectory $assets.FullName -RequestedVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify packaged release files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.admit.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = "$env:RUNNER_TEMP/github-release"
          $expected = @("LayerScape-v${env:RELEASE_VERSION}.exe", 'Fonts.zip')
          $files = @(Get-ChildItem -LiteralPath $directory -Force)
          if ($files.Count -ne $expected.Count -or ($files | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $expected })) {
            throw 'Expected the versioned deployer EXE and Fonts.zip.'
          }
          $sourceFonts = Get-FileHash -LiteralPath 'chore/Fonts.zip' -Algorithm SHA256
          $packagedFonts = Get-FileHash -LiteralPath "$directory/Fonts.zip" -Algorithm SHA256
          if ($sourceFonts.Hash -cne $packagedFonts.Hash) { throw 'Packaged Fonts.zip differs from chore/Fonts.zip.' }
          $files | Get-FileHash -Algorithm SHA256
      - name: Attest GitHub release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/github-release/*
          push-to-registry: false
          create-storage-record: false
      - name: Verify GitHub release file attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/steward-release-publish.yml
        run: |
          foreach ($file in Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/github-release" -File) {
            gh attestation verify $file.FullName --repo "$env:GITHUB_REPOSITORY" --source-ref "$env:SOURCE_REF" --source-digest "$env:SOURCE_SHA" --signer-workflow "$env:WORKFLOW" --signer-digest "$env:SOURCE_SHA" --deny-self-hosted-runners
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Upload GitHub release delivery
        id: upload-github-release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-github-release-${{ github.repository_id }}-root-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
